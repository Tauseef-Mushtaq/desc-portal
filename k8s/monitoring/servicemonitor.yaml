apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: desc-portal-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - desc-portal
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: "5000"
      interval: 15s