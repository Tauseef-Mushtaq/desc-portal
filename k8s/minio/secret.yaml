apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: desc-portal
type: Opaque
stringData:
  # Consumed by the minio Deployment to set its root user
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  # Consumed by the backend Deployment (same credentials, different env var
  # names expected by the AWS SDK)
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin123
