apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: desc-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tauseefmushtaq/desc-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: backend-secret
            - secretRef:
                name: minio-secret # provides S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: desc-portal-uploads
            - name: S3_REGION
              value: ap-south-1
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            # REQUIRED on Minikube: MinIO's API is only reachable from
            # outside the cluster via the NodePort in k8s/minio/service.yaml
            # (30900). Replace REPLACE_WITH_MINIKUBE_IP below with the
            # output of `minikube ip` before applying — otherwise signed
            # URLs for avatars/attachments point at the internal "minio:9000"
            # hostname, which a browser outside the cluster can never
            # resolve, and images will silently fail to load. Not needed
            # against real AWS S3 in production — just leave this var unset
            # there.
            - name: S3_PUBLIC_ENDPOINT
              value: "http://REPLACE_WITH_MINIKUBE_IP:30900"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
