apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: desc-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tauseefmushtaq/desc-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: backend-secret
            - secretRef:
                name: minio-secret # provides S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: desc-portal-uploads
            - name: S3_REGION
              value: ap-south-1
            - name: S3_FORCE_PATH_STYLE
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
