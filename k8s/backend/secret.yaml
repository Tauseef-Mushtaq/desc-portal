apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: desc-portal
type: Opaque
stringData:
  MONGODB_URI: mongodb://mongodb:27017/desc_portal
  # This file is committed to the repo, so this value is effectively public
  # — server.js refuses to boot with NODE_ENV=production if it sees this
  # exact placeholder. Generate a real one before applying:
  #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
  # then either edit this line directly (don't commit the real value back),
  # or override it post-apply with:
  #   kubectl create secret generic backend-secret -n desc-portal \
  #     --from-literal=JWT_SECRET=<your-generated-value> --dry-run=client -o yaml | kubectl apply -f -
  JWT_SECRET: REPLACE_THIS_WITH_A_RANDOM_64_CHAR_SECRET
  JWT_EXPIRE: 7d
  NODE_ENV: production
  CLIENT_URL: http://localhost:3000
  PORT: "5000"
