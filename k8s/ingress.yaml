apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desc-portal-ingress
  namespace: desc-portal
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Socket.IO connections are long-lived, not request/response — without
    # these, the ingress controller's default ~60s timeout would silently
    # drop idle notification sockets and force constant reconnects.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: desc-portal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
