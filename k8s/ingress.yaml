apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desc-portal-ingress
  namespace: desc-portal
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: desc-portal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
