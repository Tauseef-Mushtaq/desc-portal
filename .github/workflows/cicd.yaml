name: CI/CD Pipeline — DESC Portal

on:
  push:
    branches:
      - main

jobs:
  # ─── JOB 1: BUILD & PUSH IMAGES ───────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: tauseefmushtaq/desc-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: tauseefmushtaq/desc-frontend:latest

  # ─── JOB 2: DEPLOY NOTIFICATION ───────────────────────────────────────────
  deploy-notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deployment Success
        run: |
          echo "✅ CI/CD Pipeline Complete!"
          echo "🐳 Images pushed to Docker Hub:"
          echo "   → tauseefmushtaq/desc-backend:latest"
          echo "   → tauseefmushtaq/desc-frontend:latest"